version: '3.1'
services:
  frontend:
    container_name: temperaturas_frontend-rubengordillo
    image: iesgn/temperaturas_frontend
    restart: always
    ports:
      - "81:3000"
    networks:
      - temperaturas
    depends_on:
      - backend
  backend:
    container_name: temperaturas-backend
    image: iesgn/temperaturas_backend
    restart: always
    networks:
      - temperaturas
networks:
  temperaturas:
    name: red_temperaturas-rubengordillo