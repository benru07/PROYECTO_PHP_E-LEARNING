version: '3.1'
services:
  frontend:
    container_name: servidor_wp_rubengordillo
    image: wordpress
    restart: always
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: servidor_mysql_rubengordillo
      WORDPRESS_DB_USER: user_wp
      WORDPRESS_DB_PASSWORD: asdasd
      WORDPRESS_DB_NAME: bd_wp
    volumes:
      - ./wordpress:/var/www/html/wp-content
    networks:
      - wp
    depends_on:
      - backend
  backend:
    container_name: servidor_mysql_rubengordillo
    image: mariadb
    restart: always
    environment:
      MYSQL_DATABASE: bd_wp
      MYSQL_USER: user_wp
      MYSQL_PASSWORD: asdasd
      MYSQL_ROOT_PASSWORD: asdasd
    volumes:
      - ./mysql_wp:/var/lib/mysql
    networks:
      - wp
networks:
  wp:
    name: red_wp_rubengordillo