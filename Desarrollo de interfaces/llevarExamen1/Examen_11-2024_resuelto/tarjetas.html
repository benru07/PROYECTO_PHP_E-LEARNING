<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Sin el CSS de Bootstrap no hay cards ni grid (la plantilla vacia no lo traia) -->
    <link href="bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
    <title>Listado de libros</title>
</head>

<body>
    <!-- =====================================================================
         APARTADO B.3 (2,5 puntos): listado de libros de un genero en tarjetas.
         Esta pagina se abre desde index.html con ?idgenero=..&genero=..
         ===================================================================== -->
    <div class="container-fluid">
        <!-- Titulo EXACTO del enunciado: "LISTADO DE LIBROS DEL GÉNERO Z" (con tilde) -->
        <h1 class="text-center mb-3">LISTADO DE LIBROS DEL GÉNERO <span id="nombreGenero"></span></h1>
        <!-- Las columnas (col-*) deben ir SIEMPRE dentro de un .row -->
        <div class="row" id="tarjetas"></div>
    </div>

    <script src="bootstrap/bootstrap.min.js"></script>
    <!-- Se reutilizan ajax.js y objetos.js para crear aqui nuestro propio gestor.
         Alternativa de la solucion oficial: usar opener.oLibreria (el objeto de
         index.html), que exige "var oLibreria" y fallaria si se abre esta pagina
         directamente (opener === null). -->
    <script src="js/ajax.js"></script>
    <script src="js/objetos.js"></script>
    <script>
        "use strict";
        const oLibreria = new Libreria();

        // 1) Leer los parametros de la URL (ya vienen decodificados)
        let oURL = new URL(location.href);
        let idgenero = oURL.searchParams.get("idgenero");
        let genero = oURL.searchParams.get("genero");

        // 2) Titulo: nombre del genero en mayusculas
        document.querySelector("#nombreGenero").textContent = genero.toUpperCase();

        // 3) Pedir los libros y pintar las tarjetas
        generarTarjetas(idgenero);

        async function generarTarjetas(idgenero) {
            let respuesta = await oLibreria.getLibrosGenero(idgenero);
            let tarjetas = document.querySelector("#tarjetas");

            // Error del servidor: datos es null, no se puede recorrer
            if (!respuesta.ok) {
                tarjetas.innerHTML = `<h3>${respuesta.mensaje}</h3>`;
                return;
            }
            // Caso limite: genero sin libros
            if (respuesta.datos.length == 0) {
                tarjetas.innerHTML = "<h3>No hay libros de este género</h3>";
                return;
            }

            // Cada fila trae: idlibro, idgenero, titulo, autor, descripcion, imagen
            // y "genero" (la consulta hace un JOIN con la tabla genero).
            // Se acumula el HTML en un string y se vuelca UNA vez (no innerHTML += en el bucle).
            // Las clases col-12 col-md-4 col-lg-3 ya cumplen el Apartado C
            // (1 / 3 / 4 tarjetas por fila segun la resolucion).
            let cards = "";
            for (let libro of respuesta.datos) {
                cards += `<div class="col-12 col-md-4 col-lg-3 mb-3">
                            <div class="card h-100" style="width: 15rem;">
                              <img src="${libro.imagen}" class="card-img-top" alt="${libro.titulo}">
                              <div class="card-body">
                                <h5 class="card-title">${libro.titulo}</h5>
                                <p class="fw-light text-muted mb-1">${libro.autor}</p>
                                <p class="fw-light text-muted mb-1">${libro.genero}</p>
                                <p class="card-text">${libro.descripcion}</p>
                              </div>
                            </div>
                          </div>`;
            }
            tarjetas.innerHTML = cards;
        }
    </script>
</body>

</html>
