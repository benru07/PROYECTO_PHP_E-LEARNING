version: '3.1'
services:
  app:
    container_name: guestbook2-rubengordillo
    image: iesgn/guestbook
    restart: always
    environment:
      REDIS_SERVER: redis2-rubengordillo
    ports:
      - "5000:5000"
    networks:
      - guestbook
    depends_on:
      - db
  db:
    container_name: redis2-rubengordillo
    image: redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - volumen_redis:/data
    networks:
      - guestbook
volumes:
  volumen_redis:
    name: volumen_redis
networks:
  guestbook:
    name: red_guestbook-rubengordillo